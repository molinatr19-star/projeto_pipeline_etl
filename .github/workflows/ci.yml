name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff ty
          pip install -e .

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatação (ruff format)
        run: ruff format --check .

      - name: Tipos (ty)
        run: ty check

      - name: Testes (pytest)
        run: pytest -q
